#-----------------------------------------------------------------------
# ddc settings
#-----------------------------------------------------------------------
[[plugins]]
repo = 'Shougo/ddc-ui-native'

[[plugins]]
repo = 'Shougo/ddc.vim'
on_event = 'InsertEnter'
# NOTE: 'denops.vim' removed from depends — it is structurally always
# available via init.lua bootstrap (see dpp.toml), not a dpp-tracked plugin.
depends = ['pum.vim', 'ddc-ui-native', 'copilot.vim']
hook_add = '''
" Copilot
" <A-[>: previous completion.
inoremap <A-[> <Plug>(copilot-previous)
inoremap <A-]> <Plug>(copilot-next)
'''
hook_source = '''
  let g:copilot_no_maps = v:true
  call ddc#custom#patch_global('ui', 'native')
  call ddc#custom#patch_global('sources', ['lsp' ,'around', 'file', 'copilot', 'vsnip', 'cmdline', 'cmdline-history'])
  call ddc#custom#patch_global('sourceOptions', #{   _:#{   matchers: ['matcher_fuzzy'],   sorters: ['sorter_fuzzy'], },   copilot: #{     mark: ' Copilot',     matchers: [],     minAutoCompleteLength: 0,     isVolatile: v:true,   },   around:#{   mark: ' Text',  },   lsp:#{   mark: ' LSP',   dup: 'keep',   keywordPattern: '\k+',   forceCompletionPattern: '\.\w*|:\w*',  },   file: #{   mark: ' File',   isVolatile: v:true,   forceCompletionPattern: '\S/\S*',  },   vsnip: #{   mark: ' Snippet',   dup: v:true,   },   cmdline: #{   mark: ' Cmdline',   },   cmdline_history: #{   mark: ' Cmdline History',  }, })

" Customize settings for specific filetypes
call ddc#custom#patch_filetype(['rs', 'toml', 'py'], 'sources', ['lsp', 'around', 'file', 'vsnip', 'copilot'])
call ddc#custom#patch_filetype('markdown', 'sourceParams', #{   around: #{     maxSize: 100,   }, })


" Mappings
" <TAB>: completion.
" NOTE: '||' escaped as '<Bar><Bar>' (:h :map-bar) — under dein's script-file
" hook execution an unescaped '|' inside a :map-family {rhs} happened not to
" matter in practice, but dpp's execute({list},'') hook runner terminates
" the :inoremap command at the first unescaped '|' (verified empirically:
" without this the TAB mapping silently fails to register). Same {rhs},
" same behavior — only the pipe is escaped, not the logic.
inoremap <silent><expr> <TAB> pumvisible() ? '<C-n>' : (col('.') <= 1 <Bar><Bar> getline('.')[col('.') - 2] =~# '\s') ? '<TAB>' : ddc#map#manual_complete()

" <S-TAB>: completion back.
inoremap <expr><S-TAB> pumvisible() ? '<C-p>' : '<C-h>'
  call ddc#enable()
'''

[[plugins]]
repo = 'Shougo/ddc-around'
on_source = 'ddc.vim'

[[plugins]]
repo = 'tani/ddc-fuzzy'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-converter_remove_overlap'
on_source = 'ddc.vim'

[[plugins]]
repo = 'LumaKernel/ddc-file'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-lsp'
on_source = 'ddc.vim'

# vsnip のスニペットを ddc の補完候補に出す (neosnippet source の後継)
# Surfaces vsnip/friendly-snippets as ddc completion candidates
[[plugins]]
repo = 'uga-rosa/ddc-source-vsnip'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-cmdline'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-cmdline-history'
on_source = 'ddc.vim'

# NOTE: copilot.toml(非遅延グループ)から移動 (#494)。dpp-ext-toml の lazy は
# ファイル単位(config.ts の options.lazy)で決まるため、非遅延ファイルに置くと
# depends の ddc.vim が起動時に昇格し(rtp/hook_source が startup.vim に焼き込まれ
# sourced: true になる)、このファイル内の on_source = 'ddc.vim' 依存ソース全体で
# 連鎖が永遠に発火しなくなる。
# Moved from copilot.toml (non-lazy group) — dpp-ext-toml's lazy flag is
# decided per file (config.ts's options.lazy), so keeping this in a non-lazy
# file promotes its lazy ddc.vim dependency at startup (baked into
# startup.vim's rtp/hook_source, marked sourced: true) and permanently
# breaks the on_source chain for every on_source = 'ddc.vim' source in this
# file, not just this block.
[[plugins]]
repo = 'Shougo/ddc-source-copilot'
on_source = 'ddc.vim'
depends = ['copilot.vim']

[[plugins]]
repo = 'matsui54/denops-popup-preview.vim'
on_source = 'ddc.vim'
hook_source = '''
  call popup_preview#enable()
'''

[[plugins]]
repo = 'matsui54/denops-signature_help'
on_source = 'ddc.vim'
hook_source = '''
  call signature_help#enable()
'''

[[plugins]]
repo = 'hrsh7th/vim-vsnip'
on_event = 'InsertEnter'
depends = ['vim-vsnip-integ', 'friendly-snippets']
hook_add = '''
  imap <expr> <C-j> vsnip#expandable() ? '<Plug>(vsnip-expand)' : '<C-j>'
  smap <expr> <C-j> vsnip#expandable() ? '<Plug>(vsnip-expand)' : '<C-j>'
  imap <expr> <C-f> vsnip#jumpable(1)  ? '<Plug>(vsnip-jump-next)' : '<C-f>'
  smap <expr> <C-f> vsnip#jumpable(1)  ? '<Plug>(vsnip-jump-next)' : '<C-f>'
  imap <expr> <C-b> vsnip#jumpable(-1) ? '<Plug>(vsnip-jump-prev)' : '<C-b>'
  smap <expr> <C-b> vsnip#jumpable(-1) ? '<Plug>(vsnip-jump-prev)' : '<C-b>'
  let g:vsnip_filetypes = {}
'''
lua_add = '''
  vim.opt.completeopt = "menu,menuone,noselect"
'''

[[plugins]]
repo = 'hrsh7th/vim-vsnip-integ'

[[plugins]]
repo = 'rafamadriz/friendly-snippets'
#-----------------------------------------------------------------------
# end of ddc settings
#-----------------------------------------------------------------------
