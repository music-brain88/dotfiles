[[plugins]]
repo = 'neovim/nvim-lspconfig'
on_event = 'BufEnter'
# ddc-source-lsp の capabilities 登録に require('ddc_source_lsp') を使うため、
# 遅延読み込みされるddc-source-lspを先にrtpへ乗せておく(dein依存解決で強制ソース)
depends = ['ddc-source-lsp']
hooks_file = '$XDG_CONFIG_HOME/nvim/hooks/lspconfig.lua'

[[plugins]]
repo = 'nvimtools/none-ls.nvim'
on_event = 'BufEnter'
lua_source = '''
  local null_ls = require('null-ls')
  local augroup = vim.api.nvim_create_augroup("LspFormatting", {})
  null_ls.setup({
    sources = {
      null_ls.builtins.formatting.prettier,
    },
    on_attach = function(client, bufnr)
      if client.supports_method('textDocument/formatting') then
        vim.api.nvim_clear_autocmds({ group = augroup, buffer = bufnr })
        vim.api.nvim_create_autocmd("BufWritePre", {
          group = augroup,
          buffer = bufnr,
          callback = function()
            vim.lsp.buf.format({ bufnr = bufnr })
          end,
        })
      end
    end
  })
'''
