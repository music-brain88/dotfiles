# hyprpaper の設定 (hyprpaper 0.8 系の書式、Issue #840)
# hyprpaper config (hyprpaper 0.8 syntax, Issue #840)
#
# 画像は Nix が tools/wallpaper/ の SVG から描き、nix/modules/desktop.nix が固定パスに置く。
# ここにストアのパスは書かない。hyprpaper は path の先頭の ~ を $HOME に展開する。
# Nix renders the image from tools/wallpaper/ and nix/modules/desktop.nix places it at a fixed path.
# No store path here; hyprpaper expands a leading ~ in path to $HOME.

# 壁紙の上に Hyprland のスプラッシュの文字を重ねない
# Don't draw the Hyprland splash text over the wallpaper
splash = false

# monitor を空にすると、個別の指定が無いすべてのモニターに貼るフォールバックになる。
# cover は縦横比を保ったまま画面を覆い、はみ出た部分を切り取る。
# An empty monitor makes this the fallback for every monitor without its own entry.
# cover keeps the aspect ratio, fills the screen and crops the overflow.
wallpaper {
  monitor =
  path = ~/.local/share/wallpapers/mocha_arch.png
  fit_mode = cover
}
