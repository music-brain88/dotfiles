# hypridle 設定 — アイドル時の自動画面ロック・消灯
# Idle daemon configuration (auto-lock / screen off)
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

# hypridle 自体は今も hyprlang(.conf)で設定するが、hyprctl dispatch の引数は
# Hyprland 0.57 から Lua 式になったので、dpms は hl.dsp.dpms({ action = "on" }) で呼ぶ
# hypridle itself is still configured in hyprlang (.conf), but since Hyprland 0.57
# `hyprctl dispatch` takes a Lua expression, so dpms is called as hl.dsp.dpms({ action = "on" })
general {
    lock_cmd = pidof hyprlock || hyprlock        # 多重起動を防止 / avoid multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session     # スリープ前にロック / lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # 復帰時に画面をオン / turn screen back on after resume
}

# 30分アイドルで画面ロック / lock screen after 30 min idle
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

