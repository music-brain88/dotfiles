# Nix gnupg ships without a bundled pinentry on Linux, so the default pinentry path
# (under gnupg's own bin dir) has no binary there, causing "No pinentry" when the
# Nix-built gpg-agent starts. pinentry-program therefore has to be an absolute path (#634).
# Nix版gnupgはLinux向けにpinentryを同梱しないため、pinentry-program未設定だと
# 既定パス(gnupg自身のbin配下)に実体が無く「No pinentry」になる。そのため絶対パスで指定する(#634)。
#
# pinentry-tty instead of curses (#440): an SSH signing request carries no tty, so the agent
# shows pinentry on the tty of the last `updatestartuptty`. Many herdr panes are only 2-10
# lines tall, and pinentry-curses fails with "Screen or window too small" in panes smaller
# than about 12 lines x 70 columns; ssh then only reports "agent refused operation"
# (observed on 2026-11-02). pinentry-tty is a one-line prompt that works in a pane of any
# size, and it does not echo the input.
# curses をやめて pinentry-tty にする(#440)。SSH 経由の署名要求には tty の情報が無いので、
# agent は「最後に updatestartuptty された tty」に pinentry を出す。herdr の pane は 2〜10 行の
# ものが多く、pinentry-curses は約 12 行×70 桁より小さい pane では「Screen or window too small」で
# 失敗し、ssh 側には「agent refused operation」としか出ない(2026-11-02 に実機で発生した)。
# pinentry-tty は 1 行のプロンプトなのでどの大きさの pane でも動き、入力はエコーされない。
#
# The Arch wrapper /usr/bin/pinentry is no longer used, so gpg-agent no longer reads
# ~/.config/pinentry/preexec (#533/#534); the file and its Nix symlink stay for now (#547).
# Arch のラッパー /usr/bin/pinentry を経由しなくなるので、~/.config/pinentry/preexec(#533/#534)は
# gpg-agent からは読まれなくなる。ファイルと Nix の symlink は残す(扱いは #547 で決める)。
#
# On WSL, systemd is enabled (systemd=true in /etc/wsl.conf): gpg-agent.socket and
# gpg-agent-ssh.socket are active, and the agent runs as gpg-agent.service with --supervised.
# WSL でも /etc/wsl.conf の systemd=true で systemd が有効になっている。gpg-agent.socket と
# gpg-agent-ssh.socket が active で、agent は gpg-agent.service として --supervised で動く。
pinentry-program /usr/bin/pinentry-tty

# Serve the SSH agent protocol as well (#440). Where systemd socket activation is in place,
# gpg-agent-ssh.socket already provides the SSH socket; this line is for the path where gpg
# itself starts the agent (environments without systemd).
# SSH agent としても動かす(#440)。systemd のソケット起動がある環境では gpg-agent-ssh.socket が
# 既に SSH ソケットを提供しているので、この行は gpg 自身が agent を立ち上げる経路
# (systemd が無い環境)のためにある。
enable-ssh-support

# Cache passphrases for a workday.
# パスフレーズ入力を作業中はしばらく省略する
default-cache-ttl 28800
max-cache-ttl 86400

# gpg-agent is the SSH agent here, so SSH keys use the same TTL as other keys.
# gpg-agent を SSH agent として使っているので、SSH 鍵も同じ TTL にする
default-cache-ttl-ssh 28800
max-cache-ttl-ssh 86400
