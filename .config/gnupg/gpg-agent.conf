# Nix gnupg ships without a bundled pinentry on Linux, so the default pinentry path
# (under gnupg's own bin dir) has no binary there, causing "No pinentry" when the
# Nix-built gpg-agent auto-starts. Point at the Arch wrapper explicitly so the
# ~/.config/pinentry/preexec hook (#533/#534) still applies regardless of which
# gnupg (Nix or Arch) ends up starting the agent -- on WSL there is no
# `systemd --user`, so gpg-agent.socket activation never runs and whichever
# client calls gpg first is the one that starts the agent (#634).
# Nix版gnupgはLinux向けにpinentryを同梱しないため、pinentry-program未設定だと
# 既定パス(gnupg自身のbin配下)に実体が無く「No pinentry」になる。Archのラッパー
# を明示することで、どちらのgnupg(Nix/Arch)がagentを起動しても
# ~/.config/pinentry/preexec(#533/#534)が効くようにする。WSL機は
# systemd --userが無くgpg-agent.socketの自動起動が効かないため、最初にgpgを
# 呼んだクライアントのagentが立つ(#634)。
pinentry-program /usr/bin/pinentry

# Cache passphrases for a workday.
# パスフレーズ入力を作業中はしばらく省略する
default-cache-ttl 28800
max-cache-ttl 86400

# Keep SSH-agent cache aligned when gpg-agent is used for SSH.
# gpg-agentをSSH agentとして使う場合も同じTTLにする
default-cache-ttl-ssh 28800
max-cache-ttl-ssh 86400
