[package]
name = "standalone-check"
version = "0.1.0"
edition = "2021"
description = "配布文書の自立可読性を機械的に点検する CLI / Mechanical readability checks for distributed Japanese documents"
license = "MIT"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
