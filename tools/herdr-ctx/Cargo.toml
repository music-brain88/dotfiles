[package]
name = "herdr-ctx"
version = "0.1.0"
edition = "2021"
description = "herdr の各 agent の context 使用率と、決定者宛ての open のレビュー依頼を集める CLI / Gathers each herdr agent's context usage and the decision maker's open review requests"
license = "MIT"
publish = false

[dependencies]
# 時刻は ISO 8601 の解釈と、"as of 12:34" を利用者の地方時で出すために使う
# Used to parse ISO 8601 and to print "as of 12:34" in the user's local time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
